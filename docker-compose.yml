services:
  homelab-agent:
    build: .
    ports:
      - '3000:3000'
    environment:
      # TODO: early-dev — disables TLS verification on every outbound fetch.
      # Remove before any non-dev use and gate on per-source `allowInvalidTls`.
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./data:/app/data
